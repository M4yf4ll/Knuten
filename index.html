<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ungdomsgården Knuten</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #9333ea 0%, #ec4899 50%, #fb923c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
        }
        .date-info { text-align: right; }
        .date-text { color: #6b7280; font-size: 16px; margin-bottom: 8px; }
        .visitor-count { font-size: 36px; font-weight: bold; color: #9333ea; }
        .form-title { font-size: 24px; font-weight: bold; color: #1f2937; margin-bottom: 24px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; }
            .date-info { text-align: center; }
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 16px;
        }
        input, select {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            background: white;
        }
        input:focus, select:focus { border-color: #9333ea; outline: none; }
        .btn {
            width: 100%;
            padding: 22px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: linear-gradient(90deg, #9333ea, #ec4899);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary {
            background: #10b981;
            padding: 14px 24px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px;
        }
        .stats-toggle {
            background: #f3f4f6;
            color: #1f2937;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
            padding-bottom: 24px;
            border-bottom: 2px solid #e5e7eb;
        }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
        .stat-box { padding: 20px; border-radius: 12px; }
        .stat-box.purple { background: #f3e8ff; }
        .stat-box.pink { background: #fce7f3; }
        .stat-box.orange { background: #ffedd5; }
        .stat-box.blue { background: #dbeafe; max-height: 200px; overflow-y: auto; }
        .stat-title { font-weight: bold; color: #374151; margin-bottom: 12px; font-size: 16px; }
        .stat-item { font-size: 14px; color: #6b7280; margin: 4px 0; }
        .stat-value { font-weight: bold; }
        .stat-value.purple { color: #9333ea; }
        .stat-value.pink { color: #ec4899; }
        .stat-value.orange { color: #fb923c; }
        .stat-value.blue { color: #3b82f6; }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .export-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="title">👥 Ungdomsgården Knuten</div>
                <div class="date-info">
                    <div class="date-text" id="currentDate"></div>
                    <div class="visitor-count"><span id="visitorCount">0</span> besökare</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="form-title">➕ Registrera besök</div>
            <p class="stat-item">Inga namn eller individuella besöksuppgifter sparas. Endast dagens sammanräknade statistik sparas i den här webbläsaren.</p>
            <div class="form-grid">
                <div class="form-group">
                    <label>Åldersgrupp</label>
                    <select id="age">
                        <option value="">Välj åldersgrupp</option>
                        <option value="16">16 år</option>
                        <option value="17-18">17–18 år</option>
                        <option value="19-20">19–20 år</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kön</label>
                    <select id="gender">
                        <option value="">Välj kön</option>
                        <option value="Kille">Kille</option>
                        <option value="Tjej">Tjej</option>
                        <option value="Annan">Annan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kommun</label>
                    <select id="municipality">
                        <option value="">Välj kommun</option>
                        <option value="Brändö">Brändö</option>
                        <option value="Eckerö">Eckerö</option>
                        <option value="Finström">Finström</option>
                        <option value="Föglö">Föglö</option>
                        <option value="Geta">Geta</option>
                        <option value="Hammarland">Hammarland</option>
                        <option value="Jomala">Jomala</option>
                        <option value="Kumlinge">Kumlinge</option>
                        <option value="Kökar">Kökar</option>
                        <option value="Lemland">Lemland</option>
                        <option value="Lumparland">Lumparland</option>
                        <option value="Mariehamn">Mariehamn</option>
                        <option value="Saltvik">Saltvik</option>
                        <option value="Sottunga">Sottunga</option>
                        <option value="Sund">Sund</option>
                        <option value="Vårdö">Vårdö</option>
                    </select>
                </div>
            </div>
            <button class="btn" type="button" id="submitBtn">Registrera besök</button>
        </div>

        <div class="card">
            <div class="button-row">
                <button class="stats-toggle" type="button" id="statsToggleBtn">
                    📊 <span id="statsToggleText">Visa statistik</span>
                </button>
                <div class="export-buttons">
                    <button class="btn-secondary hidden" type="button" id="exportStatsBtn">📊 Exportera statistik</button>
                </div>
            </div>

            <div id="statsSection" class="hidden">
                <div class="stats-grid">
                    <div class="stat-box purple">
                        <div class="stat-title">Översikt</div>
                        <div class="stat-item">Totalt besökare: <span class="stat-value purple" id="statTotal">0</span></div>
                    </div>
                    <div class="stat-box pink">
                        <div class="stat-title">Könsfördelning</div>
                        <div id="statGender"></div>
                    </div>
                    <div class="stat-box orange">
                        <div class="stat-title">Åldersgrupper</div>
                        <div id="statAge"></div>
                    </div>
                    <div class="stat-box blue">
                        <div class="stat-title">Kommuner</div>
                        <div id="statMunicipality"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var today = new Date().toLocaleDateString('sv-SE');
            var storageKey = 'knuten-stats-' + today;
            var stats = { total: 0, genderCount: {}, ageGroups: {}, municipalityCount: {} };

            function cleanOldData() {
                try {
                    var allKeys = Object.keys(localStorage);
                    
                    allKeys.forEach(function(key) {
                        if (key.startsWith('knuten-entries-') ||
                            (key.startsWith('knuten-stats-') && key !== storageKey)) {
                            localStorage.removeItem(key);
                        }
                    });
                    return true;
                } catch (e) {
                    alert('Kunde inte rensa äldre inskrivningsdata. Ingen ny statistik har registrerats.');
                    return false;
                }
            }

            window.onload = function() {
                var submitBtn = document.getElementById('submitBtn');
                var storageReady = cleanOldData();

                var dateEl = document.getElementById('currentDate');
                if (dateEl) {
                    dateEl.textContent = new Date().toLocaleDateString('sv-SE', { 
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
                    });
                }

                if (storageReady) {
                    try {
                        var saved = localStorage.getItem(storageKey);
                        if (saved) stats = JSON.parse(saved);
                    } catch (e) {
                        alert('Kunde inte läsa dagens statistik. Inga nya besök kan registreras.');
                        storageReady = false;
                    }
                }

                if (submitBtn) {
                    submitBtn.onclick = handleSubmit;
                    submitBtn.disabled = !storageReady;
                }

                var statsBtn = document.getElementById('statsToggleBtn');
                if (statsBtn) {
                    statsBtn.onclick = toggleStats;
                }

                var exportStatsBtn = document.getElementById('exportStatsBtn');
                if (exportStatsBtn) {
                    exportStatsBtn.onclick = exportStats;
                }
                updateDisplay();
            };

            function handleSubmit() {
                var ageEl = document.getElementById('age');
                var genderEl = document.getElementById('gender');
                var municipalityEl = document.getElementById('municipality');

                if (!ageEl || !genderEl || !municipalityEl) {
                    alert('Fel: Formuläret kunde inte laddas korrekt!');
                    return;
                }

                var age = ageEl.value;
                var gender = genderEl.value;
                var municipality = municipalityEl.value;

                if (!age || !gender || !municipality) {
                    alert('Vänligen fyll i alla fält!');
                    return;
                }

                var nextStats = {
                    total: stats.total + 1,
                    genderCount: Object.assign({}, stats.genderCount),
                    ageGroups: Object.assign({}, stats.ageGroups),
                    municipalityCount: Object.assign({}, stats.municipalityCount)
                };
                nextStats.genderCount[gender] = (nextStats.genderCount[gender] || 0) + 1;
                nextStats.ageGroups[age] = (nextStats.ageGroups[age] || 0) + 1;
                nextStats.municipalityCount[municipality] = (nextStats.municipalityCount[municipality] || 0) + 1;
                
                try {
                    localStorage.setItem(storageKey, JSON.stringify(nextStats));
                } catch (e) {
                    alert('Kunde inte spara statistiken. Besöket har inte registrerats.');
                    return;
                }
                stats = nextStats;
                ageEl.value = '';
                genderEl.value = '';
                municipalityEl.value = '';
                
                updateDisplay();
                alert('✅ Besöket har registrerats.');
            }

            function toggleStats() {
                var section = document.getElementById('statsSection');
                var text = document.getElementById('statsToggleText');
                
                if (!section || !text) return;
                
                if (section.classList.contains('hidden')) {
                    section.classList.remove('hidden');
                    text.textContent = 'Dölj statistik';
                } else {
                    section.classList.add('hidden');
                    text.textContent = 'Visa statistik';
                }
            }

            function exportStats() {
                if (stats.total === 0) return;

                var csv = 'STATISTIK FÖR ' + today + '\n\n';
                csv += 'ÖVERSIKT\nTotalt besökare,' + stats.total + '\n\n';
                csv += 'KÖNSFÖRDELNING\n';
                for (var k in stats.genderCount) {
                    csv += k + ',' + stats.genderCount[k] + '\n';
                }
                csv += '\nÅLDERSGRUPPER\n';
                for (var k in stats.ageGroups) {
                    csv += k + ' år,' + stats.ageGroups[k] + '\n';
                }
                csv += '\nKOMMUNER\n';
                var sorted = Object.keys(stats.municipalityCount).sort(function(a,b) {
                    return stats.municipalityCount[b] - stats.municipalityCount[a];
                });
                sorted.forEach(function(k) {
                    csv += k + ',' + stats.municipalityCount[k] + '\n';
                });
                download(csv, 'knuten-statistik-' + today + '.csv');
            }

            function download(content, filename) {
                try {
                    var blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(function() {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                    alert('✅ Nedladdad!');
                } catch(e) {
                    alert('Kunde inte exportera!');
                }
            }

            function updateDisplay() {
                var countEl = document.getElementById('visitorCount');
                if (countEl) {
                    countEl.textContent = stats.total;
                }
                
                var exportStatsBtn = document.getElementById('exportStatsBtn');
                
                if (stats.total > 0) {
                    if (exportStatsBtn) exportStatsBtn.classList.remove('hidden');
                } else {
                    if (exportStatsBtn) exportStatsBtn.classList.add('hidden');
                }

                updateStats();
            }

            function updateStats() {
                var totalEl = document.getElementById('statTotal');
                
                if (totalEl) totalEl.textContent = stats.total;

                var genderEl = document.getElementById('statGender');
                if (genderEl) {
                    var html = '';
                    for (var k in stats.genderCount) {
                        html += '<div class="stat-item">' + k + ': <span class="stat-value pink">' + stats.genderCount[k] + '</span></div>';
                    }
                    genderEl.innerHTML = html;
                }

                var ageEl = document.getElementById('statAge');
                if (ageEl) {
                    var html = '';
                    for (var k in stats.ageGroups) {
                        html += '<div class="stat-item">' + k + ' år: <span class="stat-value orange">' + stats.ageGroups[k] + '</span></div>';
                    }
                    ageEl.innerHTML = html;
                }

                var munEl = document.getElementById('statMunicipality');
                if (munEl) {
                    var html = '';
                    var sorted = Object.keys(stats.municipalityCount).sort(function(a,b) {
                        return stats.municipalityCount[b] - stats.municipalityCount[a];
                    });
                    sorted.forEach(function(k) {
                        html += '<div class="stat-item">' + k + ': <span class="stat-value blue">' + stats.municipalityCount[k] + '</span></div>';
                    });
                    munEl.innerHTML = html;
                }
            }
        })();
    </script>
</body>
</html>
